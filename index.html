    // دالة مشاركة الخدمة المنسقة عبر الواتساب مع دعم النسخ الاحتياطي التوافقي للأجهزة القديمة
    function sharePrepAsText(prepId) {
        var prep = null;
        for (var x = 0; x < preparations.length; x++) {
            if (Number(preparations[x].id) === Number(prepId)) { prep = preparations[x]; break; }
        }
        if (!prep) return;

        var text = "📌 تحضير: " + prep.title + " (" + prep.songIds.length + " بنود)\n";
        text += "-----------------------------------\n";

        for (var i = 0; i < prep.songIds.length; i++) {
            var item = prep.songIds[i];
            if (item && typeof item === 'object' && item.isComment) {
                text += (i + 1) + ". 📝 تعليق: " + item.title + "\n";
            } else {
                var songId, customKey;
                if (typeof item === 'object' && item !== null) {
                    songId = item.id;
                    customKey = item.customKey;
                } else {
                    songId = item;
                    customKey = null;
                }
                var song = null;
                for (var x = 0; x < songs.length; x++) {
                    if (Number(songs[x].id) === Number(songId)) { song = songs[x]; break; }
                }
                if (song) {
                    var scale = customKey ? customKey : (song.key || "No Scale");
                    text += (i + 1) + ". 🎹 (سلم " + scale + ") - " + song.title + "\n";
                }
            }
        }
        text += "-----------------------------------\n";
        text += "تم التنسيق عبر تطبيق Scales App";

        copyToClipboard(text);
    }

    function copyToClipboard(text) {
        // فحص دعم محرك التصفح لـ Clipboard API الحديثة
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function() {
                alert("📋 تم نسخ تفاصيل الخدمة بنجاح! يمكنك الآن لصقها في واتساب.");
            }, function() {
                fallbackCopyToClipboard(text);
            });
        } else {
            fallbackCopyToClipboard(text);
        }
    }

    // دالة النسخ التوافقية لتابلت سامسونج القديم ومتصفحات الويب القديمة
    function fallbackCopyToClipboard(text) {
        var textArea = document.createElement("textarea");
        textArea.value = text;
        
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";

        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();

        try {
            var successful = document.execCommand('copy');
            if (successful) {
                alert("📋 تم نسخ تفاصيل الخدمة بنجاح! يمكنك الآن لصقها في واتساب.");
            } else {
                alert("عذراً، فشل النسخ التلقائي. يرجى تظليل النص ونسخه يدوياً.");
            }
        } catch (err) {
            alert("عذراً، هاتفك لا يدعم النسخ التلقائي.");
        }

        document.body.removeChild(textArea);
    }

    // ==========================================

    function openControlPanel() {
        controlPanel.style.display = 'flex';
        if(controlPanel.style.display !== 'flex') controlPanel.style.display = '-webkit-flex';
        panelSearchInput.value = '';
        panelFilteredList = songs.slice().sort(function(a,b){return a.title.localeCompare(b.title);});
        panelRenderIndex = 0;
        manageList.innerHTML = "";
        renderNextPanelBatch();
    }

    function closeControlPanel() {
        controlPanel.style.display = 'none';
        if(mainSearchInput.value.length > 0) mainSearch(); else {
            if (currentKey === "Preparations") {
                if (activePrepId !== null) {
                    renderPreparationDetail(activePrepId);
                } else {
                    renderPreparationsList();
                }
            } else {
                renderTitles(currentKey);
            }
        }
        refreshUI();
    }

    function searchPanelSongs() {
        var query = panelSearchInput.value;
        var filterKey = document.getElementById('panelFilterKey').value;
        var filterLetter = document.getElementById('panelFilterLetter').value;
        
        var filtered = [];
        for(var i=0; i<songs.length; i++) {
            var s = songs[i];
            var matchesSearch = true;
            if (query && query.trim() !== "") {
                matchesSearch = (calculateSearchScore(s, query) > 0);
            }
            
            var matchesKey = true;
            if(filterKey !== "") {
                var sKey = s.key || "No Scale";
                matchesKey = (sKey === filterKey);
            }

            var matchesLetter = true;
            if(filterLetter !== "") {
                var firstChar = s.title.charAt(0);
                if(filterLetter === "أ" || filterLetter === "ا") {
                     matchesLetter = (firstChar === "أ" || firstChar === "ا" || firstChar === "إ" || firstChar === "آ");
                } else {
                    matchesLetter = (firstChar.toUpperCase() === filterLetter.toUpperCase());
                }
            }

            if(matchesSearch && matchesKey && matchesLetter) {
                s.tempScore = calculateSearchScore(s, query || "");
                filtered.push(s);
            }
        }
        
        if(query && query.trim() !== "") {
             filtered.sort(function(a, b) { return b.tempScore - a.tempScore; });
        } else {
             filtered.sort(function(a, b) { return a.title.localeCompare(b.title); });
        }
        
        panelFilteredList = filtered;
        panelRenderIndex = 0;
        manageList.innerHTML = "";
        
        if(filtered.length === 0) {
            manageList.innerHTML = "<p style='text-align:center; color:#888;'>لا توجد نتائج</p>";
        } else {
            renderNextPanelBatch();
        }
    }

    function renderNextPanelBatch() {
        var oldBtn = document.getElementById('btnLoadMorePanel');
        if(oldBtn) oldBtn.parentNode.removeChild(oldBtn);

        var end = panelRenderIndex + BATCH_SIZE;
        if(end > panelFilteredList.length) end = panelFilteredList.length;

        for(var i=panelRenderIndex; i<end; i++) {
            (function(song, idx) {
                var li = document.createElement('li');
                li.className = 'manage-item';
                li.id = 'panel-row-' + song.id; 
                var html = '<div class="manage-info-box"><span class="manage-info" id="title-'+song.id+'"><bdi>' + song.title + '</bdi></span> <span class="manage-key" id="key-'+song.id+'">' + (song.key || "No Scale") + '</span></div>';
                html += '<div class="manage-btns">';
                html += '<button class="btn-edit" id="btn-edit-'+song.id+'">تعديل</button>';
                html += '<button class="btn-delete" id="btn-del-'+song.id+'">حذف</button>';
                html += '</div>';
                li.innerHTML = html;
                manageList.appendChild(li);
                document.getElementById('btn-edit-'+song.id).onclick = function() { openEditModal(song.id); };
                document.getElementById('btn-del-'+song.id).onclick = function() { deleteSong(song.id); };
            })(panelFilteredList[i], i);
        }
        
        panelRenderIndex = end;

        if(panelRenderIndex < panelFilteredList.length) {
            var btn = document.createElement('button');
            btn.id = 'btnLoadMorePanel';
            btn.className = 'load-more-btn';
            btn.innerText = '⬇️ عرض المزيد';
            btn.onclick = function() { renderNextPanelBatch(); };
            manageList.appendChild(btn);
        }
    }

    function openEditModal(songId) {
        editModal.style.display = 'flex';
        if(editModal.style.display !== 'flex') editModal.style.display = '-webkit-flex';
        var titleField = document.getElementById('editSongTitle');
        var lyricsField = document.getElementById('editSongLyrics');
        var keyField = document.getElementById('editSongKey');
        var idField = document.getElementById('editSongId');
        var modalTitle = document.getElementById('modalTitle');
        if(songId) {
            var song = null;
            for(var i=0; i<songs.length; i++) { if(Number(songs[i].id) === Number(songId)) { song = songs[i]; break; } }
            if(song) {
                idField.value = song.id;
                titleField.value = song.title;
                lyricsField.value = song.lyrics;
                keyField.value = song.key || "No Scale";
                modalTitle.innerText = "تعديل الترنيمة";
            }
        } else {
            idField.value = "";
            titleField.value = "";
            lyricsField.value = "";
            keyField.value = currentKey === "Preparations" ? "C" : currentKey;
            modalTitle.innerText = "إضافة ترنيمة جديدة";
        }
    }

    function closeEditModal() { editModal.style.display = 'none'; }

    function saveSong() {
        var id = document.getElementById('editSongId').value;
        var title = document.getElementById('editSongTitle').value;
        var lyrics = document.getElementById('editSongLyrics').value;
        var key = document.getElementById('editSongKey').value;
        if(!title || !lyrics) { alert("أكمل البيانات"); return; }
        if(id) {
            for(var i=0; i<songs.length; i++) {
                if(Number(songs[i].id) == Number(id)) {
                    songs[i] = { id: Number(id), title: title, lyrics: lyrics, key: key };
                    break;
                }
            }
        } else {
            songs.push({ id: new Date().getTime(), title: title, lyrics: lyrics, key: key });
        }
        localStorage.setItem('mySongs', JSON.stringify(songs));
        closeEditModal();
        panelSearchInput.value = '';
        renderManageList(songs);
        updateTotalCount();
        renderKeys();
    }

    // لتجنب المشاكل البرمجية مع الفانكشن الأصلية في استدعاءاتها الداخلية
    function renderManageList(songsData) {
         if (controlPanel.style.display === 'flex' || controlPanel.style.display === '-webkit-flex') {
              openControlPanel();
         }
    }

    function deleteSong(id) {
        if(confirm("هل أنت متأكد من الحذف؟")) {
            var newSongs = [];
            for(var i=0; i<songs.length; i++) {
                if(Number(songs[i].id) !== Number(id)) newSongs.push(songs[i]);
            }
            songs = newSongs;
            localStorage.setItem('mySongs', JSON.stringify(songs));
            
            // تنظيف الترانيم المحذوفة من التحضيرات أيضاً لضمان سلامة الأرشيف
            for (var k = 0; k < preparations.length; k++) {
                var tempIds = [];
                for (var x = 0; x < preparations[k].songIds.length; x++) {
                    var item = preparations[k].songIds[x];
                    var currId = (item && typeof item === 'object') ? item.id : item;
                    if (Number(currId) !== Number(id)) {
                        tempIds.push(item);
                    }
                }
                preparations[k].songIds = tempIds;
            }
            savePreparations();

            var query = panelSearchInput.value.toLowerCase();
            if(query) searchPanelSongs(); else renderManageList(songs);
            updateTotalCount();
            renderKeys();
        }
    }

    // --- تصدير الترانيم والتحضيرات وترتيب الخدمات ذاتها بملف احتياطي واحد ---
    function exportData() {
        try {
            var backupData = {
                songs: songs,
                preparations: preparations
            };
            var dataStr = JSON.stringify(backupData);
            var blob = new Blob([dataStr], {type: "application/json"});
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = "songs_backup.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        } catch(e) { alert("عذراً، هاتفك لا يدعم التصدير."); }
    }

    // --- استيراد الترانيم والتحضيرات مع التحقق الكامل لسلامة البيانات في القديم والجديد ---
    function importData(input) {
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var importedData = JSON.parse(e.target.result);
                
                // تحقق هل الملف بالصيغة المحدثة الكلية (كائن يحتوي على مصفوفتين)؟
                if (importedData && typeof importedData === 'object' && !Array.isArray(importedData)) {
                    if (importedData.songs && Array.isArray(importedData.songs)) {
                        if (confirm("تم اكتشاف ملف تحديث كامل. سيتم استبدال الترانيم والتحضيرات الحالية بالبيانات المستوردة. هل تريد الاستمرار؟")) {
                            songs = importedData.songs;
                            localStorage.setItem('mySongs', JSON.stringify(songs));
                            
                            if (importedData.preparations && Array.isArray(importedData.preparations)) {
                                preparations = importedData.preparations;
                                localStorage.setItem('myPreparations', JSON.stringify(preparations));
                            }
                            
                            alert("تم استيراد الترانيم والتحضيرات بنجاح تام!");
                            location.reload();
                        }
                    } else {
                        alert("محتوى الملف غير صالح للاستيراد.");
                    }
                } 
                // التحقق هل الملف بالصيغة القديمة (مصفوفة ترانيم مجردة)؟
                else if (importedData && Array.isArray(importedData)) {
                    if (confirm("تم اكتشاف ملف قديم يحتوي على ترانيم فقط. هل تريد استيراده واستبدال الترانيم الحالية؟ (لن يتم المساس بتحضيراتك الحالية)")) {
                        songs = importedData;
                        localStorage.setItem('mySongs', JSON.stringify(songs));
                        alert("تم استيراد قائمة الترانيم بنجاح!");
                        location.reload();
                    }
                } else { 
                    alert("الملف غير صالح"); 
                }
            } catch (err) { 
                alert("خطأ في قراءة وتحليل الملف"); 
            }
        };
        reader.readAsText(file);
    }

    init();
</script>
